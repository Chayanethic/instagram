<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #262626;
    }

    .wrapper {
      width: 100%;
      max-width: 350px;
      padding: 20px;
      text-align: center;
    }

    .login-card {
      background: #fff;
      border: 1px solid #dbdbdb;
      padding: 35px 30px;
      margin-bottom: 10px;
    }

    .brand {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      color: #8e8e8e;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    input {
      width: 100%;
      padding: 9px 8px;
      border: 1px solid #dbdbdb;
      border-radius: 3px;
      background: #fafafa;
      font-size: 12px;
      outline: none;
    }

    input:focus {
      border-color: #a8a8a8;
      background: #fff;
    }

    button {
      margin-top: 8px;
      padding: 7px 16px;
      border: none;
      border-radius: 8px;
      background: #0095f6;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #1877f2;
    }

    .error {
      color: #ed4956;
      font-size: 14px;
      margin-top: 15px;
    }

    .note {
      font-size: 12px;
      color: #8e8e8e;
      margin-top: 10px;
    }

    .secondary-card {
      background: #fff;
      border: 1px solid #dbdbdb;
      padding: 18px;
      margin-bottom: 20px;
    }

    .secondary-card a {
      color: #00376b;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
    }

    .footer {
      font-size: 12px;
      color: #8e8e8e;
    }

    .footer a {
      color: #8e8e8e;
      text-decoration: none;
      margin-right: 8px;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="login-card">
      <div class="brand">YourApp</div>
      <div class="title">Log into YourApp</div>

      <form method="POST" action="{{ url_for('login') }}">
        <input
          type="text"
          name="username"
          placeholder="Phone number, username, or email"
          required
        />

        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        />

        <button type="submit">Log in</button>
      </form>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      {% if remaining is defined and remaining == 1 %}
        <div class="note">
          1 attempt left before redirecting to forgot password.
        </div>
      {% endif %}
    </div>

    <div class="secondary-card">
      <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
    </div>

    <div class="footer">
      <a href="#">Create new account</a>
      <span>Your Company</span>
    </div>
  </div>
</body>
</html>
