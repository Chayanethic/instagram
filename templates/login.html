<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log into Instagram</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            margin-top: 50px; 
        }
        form { 
            display: inline-block; 
            text-align: left; 
            border: 1px solid #dbdbdb; 
            padding: 20px; 
            border-radius: 5px;
        }
        input { 
            display: block; 
            margin-bottom: 10px; 
            padding: 8px; 
            width: 250px; 
            border: 1px solid #dbdbdb; 
            border-radius: 3px;
        }
        button { 
            width: 100%; 
            padding: 8px; 
            background-color: #0095f6; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            font-weight: bold;
            cursor: pointer;
        }
        .error-msg { 
            color: #ed4956; 
            font-size: 14px; 
            display: none; 
            margin-top: 10px;
        }
        a { color: #00376b; font-size: 12px; text-decoration: none; }
    </style>
</head>
<body>

    <h2>Log into Instagram</h2>
    
    <form id="loginForm">
        <input type="text" placeholder="Phone number, username, or email" required>
        <input type="password" id="passwordInput" placeholder="Password" required>
        <button type="submit">Log in</button>
        <p id="errorMsg" class="error-msg">{{ error }} Please enter your password.</p>
    </form>
    
    <br>
    <a href="https://www.instagram.com/accounts/password/reset/?hl=en" id="forgotPassLink">Forgot password?</a>
    <br><br>
    <p>Create new account</p>
    <p>Meta</p>

    <script>
        // Variable to keep track of failed attempts
        let failedAttempts = 0;
        const maxAttempts = 2;
        const resetUrl = "https://www.instagram.com/accounts/password/reset/?hl=en";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            // Prevent the form from actually submitting to a server for this demo
            e.preventDefault(); 
            
            // TODO: Replace this with your actual backend authentication logic
            // For this example, we assume the login always fails so we can test the redirect
            const isLoginSuccessful = false; 

            if (!isLoginSuccessful) {
                failedAttempts++;
                
                // Check if attempts have reached the limit
                if (failedAttempts >= maxAttempts) {
                    alert("Too many failed attempts. Redirecting you to the Forgot Password page...");
                    window.location.href = resetUrl; // Redirects the user
                } else {
                    // Show error message and remaining attempts
                    const errorMsg = document.getElementById('errorMsg');
                    errorMsg.style.display = 'block';
                    errorMsg.innerText = `Invalid credentials. ${maxAttempts - failedAttempts} attempt(s) remaining before redirect.`;
                }
            } else {
                // Handle successful login here
                window.location.href = "/dashboard"; 
            }
        });
    </script>

</body>
</html>
