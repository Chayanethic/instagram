<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }

        .login-box {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 40px;
            width: 350px;
            text-align: center;
            margin-bottom: 10px;
        }

        .instagram-logo {
            font-family: 'Billabong', cursive, sans-serif;
            font-size: 40px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 16px;
            font-weight: 600;
            color: #8e8e8e;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        input {
            padding: 9px 8px;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 12px;
            background: #fafafa;
            outline: none;
        }

        input:focus {
            border-color: #a8a8a8;
        }

        button {
            margin-top: 8px;
            padding: 7px 16px;
            background-color: #0095f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1877f2;
        }

        .error-msg {
            color: #ed4956;
            font-size: 14px;
            margin-top: 15px;
            display: none; /* Hidden by default */
        }

        .links-box {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            padding: 20px;
            width: 350px;
            text-align: center;
            margin-bottom: 20px;
        }

        .links-box a {
            color: #00376b;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
        }

        .app-download {
            text-align: center;
            margin-bottom: 20px;
        }

        .app-download p {
            font-size: 14px;
            margin: 5px 0;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #8e8e8e;
        }
        
        .footer span {
            margin: 0 10px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="instagram-logo">Instagram</div>
        <h2>Log into Instagram</h2>
        
        <form id="loginForm">
            <input type="text" placeholder="Phone number, username, or email" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Log in</button>
        </form>
        
        <!-- Error message area matching your text -->
        <p class="error-msg" id="errorMsg">{{ error }} Please enter your password. Not able to do forget password.</p>
    </div>

    <div class="links-box">
        <a href="https://www.instagram.com/accounts/password/reset/?hl=en" id="forgotPassLink">Forgot password?</a>
    </div>

    <div class="app-download">
        <p>Create new account</p>
    </div>

    <div class="footer">
        <span>Meta</span>
    </div>

    <script>
        let failedAttempts = 0;
        const maxAttempts = 2;
        const resetUrl = "https://www.instagram.com/accounts/password/reset/?hl=en";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            // Prevent default form submission for this demo
            e.preventDefault(); 
            
            // Simulate a failed login (Replace this with your actual backend check)
            const isLoginSuccessful = false; 

            if (!isLoginSuccessful) {
                failedAttempts++;
                
                if (failedAttempts >= maxAttempts) {
                    // Redirect to forgot password after 2 attempts
                    alert("2 failed attempts detected. Redirecting to Forgot Password...");
                    window.location.href = resetUrl; 
                } else {
                    // Show error message
                    const errorMsg = document.getElementById('errorMsg');
                    errorMsg.style.display = 'block';
                    errorMsg.innerText = `{{ error }} Please enter your password. Not able to do forget password. (${maxAttempts - failedAttempts} attempt left)`;
                }
            } else {
                // Handle successful login
                window.location.href = "/"; 
            }
        });
    </script>

</body>
</html>
